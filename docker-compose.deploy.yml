services:
  postgres:
    image: postgres:15-alpine
    container_name: tcg-nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-tcg_nexus}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tcg-nexus-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vision:
    build:
      context: ./apps/vision
      dockerfile: Dockerfile
    container_name: tcg-nexus-vision
    restart: unless-stopped
    networks:
      - tcg-nexus-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tcg-nexus-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      vision:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_SSL: "false"
      NODE_ENV: production
      FRONTEND_URL: https://tcg-nexus.org
      COOKIE_DOMAIN: tcg-nexus.org
      VISION_SERVICE_URL: http://vision:8000
    ports:
      - "3001:3001"
    networks:
      - tcg-nexus-network
    # L'image purge curl : la sonde passe par le runtime Node déjà présent.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/api',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      # Migrations et chargement du catalogue avant le premier succès.
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Le catalogue est embarqué dans l'image (data/ est versionné). Monter un
    # volume sur /app/data n'est utile que pour servir un dataset plus récent
    # que le déploiement — il masquerait sinon les cartes livrées avec l'image.
    # volumes:
    #   - /srv/tcg-nexus/data:/app/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SEALED_CDN_URL: ${NEXT_PUBLIC_SEALED_CDN_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    container_name: tcg-nexus-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://api:3001/api
    ports:
      - "3000:3000"
    networks:
      - tcg-nexus-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    container_name: tcg-nexus-docs
    restart: unless-stopped
    ports:
      - "3002:3002"
    networks:
      - tcg-nexus-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local

networks:
  tcg-nexus-network:
    driver: bridge
