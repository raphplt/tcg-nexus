services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: tcg_nexus_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${E2E_DATABASE_PORT:-55432}:5432"
    # Card search relies on pg_trgm, unaccent and immutable_unaccent: without
    # them the search suite only ever exercised the early-return branch.
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcg_nexus_test"]
      interval: 1s
      timeout: 5s
      retries: 30
