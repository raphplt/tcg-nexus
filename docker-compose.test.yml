services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: tcg_nexus_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${E2E_DATABASE_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcg_nexus_test"]
      interval: 1s
      timeout: 5s
      retries: 30
