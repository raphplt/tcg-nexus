name: Deploy via Coolify

on:
    push:
        branches:
            - main

concurrency:
    group: deploy-production
    cancel-in-progress: true

jobs:
    ci:
        name: CI Check
        uses: ./.github/workflows/ci.yml

    deploy:
        name: Trigger Coolify deploy
        runs-on: ubuntu-latest
        needs: [ci]
        environment: production
        # Garde-fou : le job ne s'exécute que si la variable de repo
        # COOLIFY_DEPLOY_ENABLED vaut "true" (Settings → Variables).
        # Laisser désactivé tant que l'API Coolify n'est pas exposée via le tunnel.
        if: ${{ vars.COOLIFY_DEPLOY_ENABLED == 'true' }}

        steps:
            - name: Call Coolify deploy API
              run: |
                  curl --fail --silent --show-error -X POST \
                    -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
                    "${{ secrets.COOLIFY_API_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_RESOURCE_UUID }}"
              # Prérequis (voir doc/mise-a-jour-prod.md) :
              #   - COOLIFY_API_URL       ex: https://coolify.tcg-nexus.org
              #   - COOLIFY_API_TOKEN     Coolify → Keys & Tokens → API tokens
              #   - COOLIFY_RESOURCE_UUID uuid de la ressource (visible dans son URL)
