name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  delete: {}
  workflow_dispatch: {}

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      # Rendu ETNA : module-10020 / activity-53633 / group-1070334
      GITLAB_MIRROR_URL: https://rendu-git.etna-alternance.net/module-10020/activity-53633/group-1070334.git
      GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GitLab credentials
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN manquant. Cree un Personal/Project Access Token GitLab (scope write_repository) sur rendu-git.etna-alternance.net, puis ajoute-le en secret GitHub."
            exit 1
          fi

      - name: Add GitLab remote
        run: |
          set -euo pipefail
          gitlab_username="${GITLAB_USERNAME:-oauth2}"
          git remote add gitlab \
            "https://${gitlab_username}:${GITLAB_TOKEN}@${GITLAB_MIRROR_URL#https://}"

      - name: Mirror branches and tags
        run: |
          set -euo pipefail
          # actions/checkout ne cree qu'une seule branche locale : on pousse les
          # refs de suivi refs/remotes/origin/* (toutes les branches GitHub).
          # origin/HEAD est un ref symbolique : il creerait une branche "HEAD".
          git remote set-head origin -d || true
          # --prune supprime cote GitLab les branches/tags disparus de GitHub.
          git push --force --prune gitlab \
            'refs/remotes/origin/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
