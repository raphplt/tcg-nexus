name: CI/CD Pipeline

on:
    pull_request:
        branches:
            - main
            - develop
            - "**"
    push:
        branches:
            - main
            - develop
    workflow_call:

jobs:
    # Lint and workspace type checks
    lint-and-types:
        name: Lint & Type Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Check types
              run: npm run check-types

    # Backend regression tests and compilation
    backend:
        name: Backend Tests & Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run backend tests with coverage
              working-directory: apps/api
              run: npm test -- --coverage --runInBand --no-watchman

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-coverage-report
                  path: apps/api/coverage
                  retention-days: 14

            - name: Run tournament E2E tests on ephemeral PostgreSQL
              working-directory: apps/api
              run: npm run test:e2e:postgres -- test/tournament.e2e-spec.ts test/tournament-concurrency.e2e-spec.ts test/tournament-operations.e2e-spec.ts

            - name: Run marketplace, collection, settlement and migration E2E tests on ephemeral PostgreSQL
              working-directory: apps/api
              run: npm run test:e2e:postgres -- test/collection.e2e-spec.ts test/marketplace.e2e-spec.ts test/order-flow.e2e-spec.ts test/settlement-and-journey.e2e-spec.ts test/migrations.e2e-spec.ts test/product-maturity-authorization.e2e-spec.ts test/product-maturity-refunds.e2e-spec.ts test/product-maturity-settlement.e2e-spec.ts test/product-maturity-inventory.e2e-spec.ts

            - name: Build backend
              working-directory: apps/api
              run: npm run build

    # Frontend regression tests and compilation
    frontend:
        name: Frontend Tests & Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run frontend tests
              working-directory: apps/web
              run: npm test

            - name: Check frontend types
              working-directory: apps/web
              run: npm run check-types

            - name: Lint frontend
              working-directory: apps/web
              run: npm run lint

            - name: Build frontend
              working-directory: apps/web
              env:
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
              run: npm run build

    supporting-tests:
        name: Supporting Workspace Tests
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                workspace: [fetch, mobile, "@repo/effect-parser", "@repo/pokemon-dataset"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - run: npm ci
            - run: npm test --workspace '${{ matrix.workspace }}'

    vision-tests:
        name: Vision Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: apps/vision/requirements.txt
            - run: pip install -r apps/vision/requirements.txt
            - run: python scripts/run-vision-tests.py

    docs:
        name: Documentation Build & Links
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Check docs types
              run: npm run check-types --workspace apps-docs

            - name: Build documentation portal
              run: npm run build --workspace apps-docs

    # Verify all workspace builds together
    build-all:
        name: Build All
        runs-on: ubuntu-latest
        needs: [lint-and-types, backend, frontend, supporting-tests, vision-tests, docs]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build all packages
              env:
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
              run: npm run build
